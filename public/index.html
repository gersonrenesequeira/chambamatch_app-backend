<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración y Pruebas - ChambaMatch</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2b4c7e;
            --accent-color: #1b8a43;
            --bg-color: #f4f6f9;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .main-header {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }

        .card-header-title {
            color: var(--primary-color);
            font-weight: 700;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 10px;
        }

        .btn-success-custom {
            background-color: var(--accent-color);
            border: none;
            color: white;
            font-weight: 600;
        }

        .btn-success-custom:hover {
            background-color: #156d34;
            color: white;
        }

        .btn-primary-custom {
            background-color: #0d6efd;
            color: white;
            font-weight: 600;
        }

        .badge-client {
            background-color: #e2d9f3;
            color: #6f42c1;
            font-weight: 600;
        }

        .badge-tech {
            background-color: #d1e7dd;
            color: #0f5132;
            font-weight: 600;
        }

        #previewFoto {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            display: none;
            margin-top: 10px;
            border: 2px solid var(--primary-color);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }

        .terminal-log {
            background-color: #1a252f;
            color: #2ec4b6;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.85rem;
            min-height: 45px;
        }

        .loading-text {
            color: #6c757d;
            font-style: italic;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>

<body>

    <div class="container py-4">
        <!-- TÍTULO PRINCIPAL DE LA APLICACIÓN -->
        <h1 class="text-center main-header">🛠️ Panel de Pruebas API - ChambaMatch</h1>

        <div class="row g-4">

            <!-- COLUMNA IZQUIERDA: LOGIN Y FORMULARIO DE REGISTRO/EDICIÓN -->
            <div class="col-12 col-lg-5">

                <!-- 1. MÓDULO DE LOGIN DE PRUEBA -->
                <div class="card p-4 mb-4">
                    <h5 class="card-header-title">🔑 1. Probar Login (POST /api/usuarios/login)</h5>
                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="loginCorreo" class="form-label fw-semibold">Correo:</label>
                            <input type="email" class="form-control" id="loginCorreo" required placeholder="correo@ejemplo.com">
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label fw-semibold">Contraseña:</label>
                            <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
                        </div>
                        <button type="submit" id="btnLogin" class="btn btn-success-custom w-100 py-2">Iniciar Sesión</button>
                    </form>
                    <div id="logEstadoLogin" class="terminal-log mt-3">Esperando acción...</div>
                </div>

                <!-- 2. MÓDULO DE CREAR O EDITAR USUARIO -->
                <div class="card p-4">
                    <h5 class="card-header-title" id="tituloFormUsuario">👤 2. Crear / Editar Usuario</h5>

                    <form id="formUsuario">
                        <!-- ID oculto para determinar si se está Creando o Editando -->
                        <input type="hidden" id="usuarioId">

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" required placeholder="Ej. Juan Pérez">
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label fw-semibold">Email:</label>
                            <input type="email" class="form-control" id="correo" required placeholder="correo@ejemplo.com">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Contraseña:</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••">
                            <small class="text-muted d-block mt-1" id="helpPassword">Déjala en blanco si no deseas cambiarla al editar.</small>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label fw-semibold">Teléfono:</label>
                            <input type="text" class="form-control" id="telefono" placeholder="Ej. +505 8888 8888">
                        </div>

                        <div class="mb-3">
                            <label for="rol" class="form-label fw-semibold">Rol de Usuario:</label>
                            <select class="form-select" id="rol">
                                <option value="Cliente" selected>Cliente</option>
                                <option value="Técnico">Técnico Independentista</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="foto" class="form-label fw-semibold">Foto de Perfil (Opcional):</label>
                            <input type="file" class="form-control" id="foto" accept="image/*">
                            <div class="text-center">
                                <img id="previewFoto" alt="Previsualización de foto de perfil">
                            </div>
                        </div>

                        <button type="submit" id="btnGuardarUsuario" class="btn btn-primary w-100 py-2">Guardar Usuario</button>
                        <button type="button" id="btnCancelarEdicion" class="btn btn-outline-secondary w-100 mt-2" style="display: none;">Cancelar Edición</button>
                    </form>

                    <!-- Alertas de estado de respuesta de API -->
                    <div id="alertResultado" class="alert mt-3" style="display: none;" role="alert"></div>
                </div>

            </div>

            <!-- COLUMNA DERECHA: TABLA DE USUARIOS DESDE FIRESTORE -->
            <div class="col-12 col-lg-7">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-header-title mb-0">📋 Usuarios en Firestore</h5>
                        <button class="btn btn-primary-custom btn-sm" id="btnRecargar">🔄 Recargar</button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Perfil</th>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>Teléfono</th>
                                    <th>Rol</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaUsuarios">
                                <tr>
                                    <td colspan="6" class="loading-text">Cargando datos de Firestore...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT JS PRINCIPAL -->
    <script>
        const BACKEND_URL = "/api/usuarios";

        // Elementos DOM
        const formLogin = document.getElementById("formLogin");
        const logEstadoLogin = document.getElementById("logEstadoLogin");

        const formUsuario = document.getElementById("formUsuario");
        const usuarioIdInput = document.getElementById("usuarioId");
        const tituloFormUsuario = document.getElementById("tituloFormUsuario");
        const btnGuardarUsuario = document.getElementById("btnGuardarUsuario");
        const btnCancelarEdicion = document.getElementById("btnCancelarEdicion");
        const fotoInput = document.getElementById("foto");
        const previewFoto = document.getElementById("previewFoto");
        const alertResultado = document.getElementById("alertResultado");

        const tablaUsuarios = document.getElementById("tablaUsuarios");
        const btnRecargar = document.getElementById("btnRecargar");

        // Guardar copia local de usuarios cargados para evitar inconsistencias de pintado
        let listaUsuariosGlobal = [];

        // Previsualización de imagen elegida
        fotoInput.addEventListener("change", function () {
            const archivo = this.files[0];
            if (archivo) {
                previewFoto.src = URL.createObjectURL(archivo);
                previewFoto.style.display = "inline-block";
            }
        });

        // 1. LOGIN
        formLogin.addEventListener("submit", async function (e) {
            e.preventDefault();
            logEstadoLogin.textContent = "Procesando autenticación...";

            const correo = document.getElementById("loginCorreo").value.trim();
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await fetch(`${BACKEND_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ correo, password })
                });

                const data = await res.json();
                if (res.ok) {
                    logEstadoLogin.style.color = "#2ec4b6";
                    logEstadoLogin.textContent = `✓ Éxito: Bienvenido ${data.usuario?.nombre || correo}`;
                } else {
                    logEstadoLogin.style.color = "#ff6b6b";
                    logEstadoLogin.textContent = `✕ Error: ${data.mensaje || "Credenciales inválidas"}`;
                }
            } catch (err) {
                logEstadoLogin.style.color = "#ff6b6b";
                logEstadoLogin.textContent = "✕ Error de conexión con el servidor.";
            }
        });

        // 2. CREAR / EDITAR USUARIO
        formUsuario.addEventListener("submit", async function (e) {
            e.preventDefault();

            alertResultado.style.display = "none";
            const idEditando = usuarioIdInput.value;
            const esEdicion = Boolean(idEditando);

            btnGuardarUsuario.disabled = true;
            btnGuardarUsuario.textContent = esEdicion ? "Actualizando..." : "Guardando...";

            const formData = new FormData();
            formData.append("nombre", document.getElementById("nombre").value.trim());
            formData.append("correo", document.getElementById("correo").value.trim());
            formData.append("telefono", document.getElementById("telefono").value.trim());
            formData.append("rol", document.getElementById("rol").value);

            // Contraseña solo si fue escrita
            const passwordVal = document.getElementById("password").value;
            if (passwordVal) {
                formData.append("password", passwordVal);
            }

            // Foto solo si seleccionó un nuevo archivo
            if (fotoInput.files.length > 0) {
                formData.append("foto", fotoInput.files[0]);
            }

            const url = esEdicion ? `${BACKEND_URL}/${idEditando}` : BACKEND_URL;
            const metodo = esEdicion ? "PUT" : "POST";

            try {
                const respuesta = await fetch(url, {
                    method: metodo,
                    body: formData
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    alertResultado.className = "alert alert-success mt-3";
                    alertResultado.textContent = data.mensaje || (esEdicion ? "Usuario actualizado correctamente." : "Usuario creado correctamente.");
                    alertResultado.style.display = "block";

                    resetearFormularioUsuario();
                    cargarUsuarios();
                } else {
                    alertResultado.className = "alert alert-danger mt-3";
                    alertResultado.textContent = data.mensaje || "Error en el servidor al guardar el usuario.";
                    alertResultado.style.display = "block";
                }
            } catch (error) {
                console.error("Error en la petición:", error);
                alertResultado.className = "alert alert-danger mt-3";
                alertResultado.textContent = "Error de conexión o fallo interno del servidor (500).";
                alertResultado.style.display = "block";
            } finally {
                btnGuardarUsuario.disabled = false;
                btnGuardarUsuario.textContent = esEdicion ? "Actualizar Usuario" : "Guardar Usuario";
            }
        });

        // 3. SELECCIONAR USUARIO PARA EDITAR
        function prepararEdicion(id) {
            const usuario = listaUsuariosGlobal.find(u => (u.id || u._id) === id);
            if (!usuario) return;

            usuarioIdInput.value = id;
            document.getElementById("nombre").value = usuario.nombre || "";
            document.getElementById("correo").value = usuario.correo || usuario.email || "";
            
            // Rellena el campo de teléfono asegurando compatibilidad con la propiedad
            const telExacto = usuario.telefono ?? usuario.phone ?? usuario.tel ?? usuario.celular ?? "";
            document.getElementById("telefono").value = telExacto;

            document.getElementById("rol").value = usuario.rol || "Cliente";
            document.getElementById("password").value = ""; // Limpio para que no la cambie accidentalmente

            // Foto actual
            fotoInput.value = "";
            const fotoUrl = usuario.fotoUrl || usuario.imagenUrl || usuario.foto;
            if (fotoUrl) {
                previewFoto.src = fotoUrl;
                previewFoto.style.display = "inline-block";
            } else {
                previewFoto.src = "";
                previewFoto.style.display = "none";
            }

            tituloFormUsuario.textContent = "✏️ Editar Usuario";
            btnGuardarUsuario.textContent = "Actualizar Usuario";
            btnCancelarEdicion.style.display = "block";

            formUsuario.scrollIntoView({ behavior: "smooth" });
        }

        btnCancelarEdicion.addEventListener("click", resetearFormularioUsuario);

        function resetearFormularioUsuario() {
            usuarioIdInput.value = "";
            formUsuario.reset();
            previewFoto.src = "";
            previewFoto.style.display = "none";
            tituloFormUsuario.textContent = "👤 2. Crear / Editar Usuario";
            btnGuardarUsuario.textContent = "Guardar Usuario";
            btnCancelarEdicion.style.display = "none";
        }

        // 4. ELIMINAR USUARIO
        async function eliminarUsuario(id, nombre) {
            if (!confirm(`¿Deseas eliminar a "${nombre}"?`)) return;

            try {
                const respuesta = await fetch(`${BACKEND_URL}/${id}`, { method: "DELETE" });
                const data = await respuesta.json();

                if (respuesta.ok) {
                    alert(data.mensaje || "Usuario eliminado.");
                    cargarUsuarios();
                } else {
                    alert(data.mensaje || "Error al eliminar usuario.");
                }
            } catch (error) {
                console.error("Error al eliminar:", error);
                alert("Error de conexión al eliminar.");
            }
        }

        // 5. OBTENER TABLA DESDE FIRESTORE
        async function cargarUsuarios() {
            tablaUsuarios.innerHTML = `<tr><td colspan="6" class="loading-text">Cargando datos de Firestore...</td></tr>`;

            try {
                const respuesta = await fetch(BACKEND_URL, { method: "GET" });
                const datos = await respuesta.json();

                if (!respuesta.ok) throw new Error(datos.mensaje || "Error al consultar usuarios.");

                listaUsuariosGlobal = Array.isArray(datos) ? datos : (datos.usuarios || []);

                if (listaUsuariosGlobal.length === 0) {
                    tablaUsuarios.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No hay usuarios registrados.</td></tr>`;
                    return;
                }

                tablaUsuarios.innerHTML = listaUsuariosGlobal.map((user) => {
                    const userId = user.id || user._id || "";
                    const foto = user.fotoUrl || user.imagenUrl || user.foto || "https://ui-avatars.com/api/?name=" + encodeURIComponent(user.nombre || "Usuario");
                    const tel = user.telefono || user.phone || user.tel || user.celular || "—";
                    const badgeClass = user.rol === "Técnico" ? "badge-tech" : "badge-client";
                    const nombreLimpio = String(user.nombre || "Usuario").replace(/'/g, "\\'");

                    return `
                        <tr>
                            <td>
                                <img src="${foto}" class="user-avatar" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User'">
                            </td>
                            <td class="fw-bold">${user.nombre || "Sin nombre"}</td>
                            <td>${user.correo || user.email || "N/A"}</td>
                            <td>${tel}</td>
                            <td><span class="badge ${badgeClass}">${user.rol || "Cliente"}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="prepararEdicion('${userId}')">
                                    ✏️ Editar
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuario('${userId}', '${nombreLimpio}')">
                                    🗑️ Borrar
                                </button>
                            </td>
                        </tr>
                    `;
                }).join("");

            } catch (error) {
                console.error("Error en lista:", error);
                tablaUsuarios.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger py-4">
                            ✕ Error al consultar el servidor.
                        </td>
                    </tr>
                `;
            }
        }

        btnRecargar.addEventListener("click", cargarUsuarios);
        document.addEventListener("DOMContentLoaded", cargarUsuarios);
    </script>
</body>

</html>
